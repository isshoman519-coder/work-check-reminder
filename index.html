<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1d4ed8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="근무확인">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<title>근무확인 알리미</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;color-scheme:light dark}
body{margin:0;min-height:100svh;display:grid;place-items:center;background:#0f172a;color:#f8fafc;padding:20px;box-sizing:border-box}
.card{width:min(100%,420px);background:#1e293b;border:1px solid #334155;border-radius:24px;padding:24px;box-sizing:border-box}
h1{font-size:24px;margin:0 0 8px}.mut{color:#94a3b8;line-height:1.5}
.code{font-size:30px;letter-spacing:.12em;font-weight:900;text-align:center;background:#0f172a;border-radius:16px;padding:18px 10px;margin:18px 0;user-select:all}
button{width:100%;border:0;border-radius:15px;padding:16px;margin-top:10px;font-size:17px;font-weight:800;background:#2563eb;color:#fff}
button.secondary{background:#334155}#st{margin-top:14px;font-size:13px;color:#cbd5e1;line-height:1.5;word-break:break-word}
.ok{color:#86efac}.warn{color:#fca5a5}
</style>
</head>
<body>
<div class="card">
  <h1>⏱ 근무확인 알리미</h1>
  <div class="mut">PC 근무확인 버튼과 이 아이폰을 한 번만 연결하면 이후엔 PC 클릭만으로 50분 알림이 자동 예약돼요.</div>

  <div class="mut" style="margin-top:18px">PC 확장프로그램에 입력할 페어링 코드</div>
  <div id="code" class="code">----------</div>

  <button id="enable">🔔 이 아이폰 알림 등록</button>
  <button id="test" class="secondary">테스트 알림 보내기</button>
  <button id="newcode" class="secondary">새 페어링 코드 만들기</button>

  <div id="st">v4 · PC 자동연동</div>
</div>

<script>
const WORKER_URL='https://overtime-alarm.wogns2925.workers.dev';
const $=id=>document.getElementById(id);
const standalone=navigator.standalone||matchMedia('(display-mode: standalone)').matches;
const isIOS=/iPhone|iPad|iPod/.test(navigator.userAgent);

function makeCode(){
  const alphabet='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';
  const arr=new Uint8Array(12);crypto.getRandomValues(arr);
  return Array.from(arr,b=>alphabet[b%alphabet.length]).join('');
}
let code=localStorage.getItem('pairCode')||makeCode();
localStorage.setItem('pairCode',code);
$('code').textContent=code;

const b64=s=>{
  const p='='.repeat((4-s.length%4)%4);
  const r=atob((s+p).replace(/-/g,'+').replace(/_/g,'/'));
  return Uint8Array.from(r,c=>c.charCodeAt(0));
};

let swPromise;
function prepareSW(){
  if(!swPromise){
    swPromise=navigator.serviceWorker.register('./sw.js?v=4',{scope:'./'})
      .then(()=>navigator.serviceWorker.ready);
  }
  return swPromise;
}
if('serviceWorker' in navigator) prepareSW().catch(()=>{});

async function registerPhone(){
  try{
    if(isIOS&&!standalone) throw new Error('홈 화면에 추가한 앱 아이콘으로 실행해 주세요.');
    let p=Notification.permission;
    if(p==='default') p=await Notification.requestPermission();
    if(p!=='granted') throw new Error('알림 권한이 허용되지 않았어요.');

    $('st').textContent='서비스워커 준비 중...';
    const reg=await prepareSW();

    const pub=(await (await fetch(WORKER_URL+'/vapid',{cache:'no-store'})).text()).trim();
    let sub=await reg.pushManager.getSubscription();
    if(!sub) sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64(pub)});

    const r=await fetch(WORKER_URL+'/register',{
      method:'POST',
      headers:{'content-type':'application/json'},
      body:JSON.stringify({code,sub:sub.toJSON?sub.toJSON():sub})
    });
    const j=await r.json();
    if(!r.ok||!j.ok) throw new Error(j.error||('HTTP '+r.status));

    $('st').innerHTML='<span class="ok">✅ 아이폰 등록 완료. 이제 PC 확장프로그램에 위 코드를 입력하세요.</span>';
  }catch(e){
    $('st').innerHTML='<span class="warn">❌ 등록 실패: '+(e.message||e)+'</span>';
  }
}

async function testPush(){
  try{
    const r=await fetch(WORKER_URL+'/test',{
      method:'POST',
      headers:{'content-type':'application/json'},
      body:JSON.stringify({code})
    });
    const j=await r.json();
    if(!r.ok) throw new Error(j.error||('HTTP '+r.status));
    $('st').textContent='✅ 테스트 전송 요청 완료 (응답 '+j.status+')';
  }catch(e){
    $('st').textContent='❌ 테스트 실패: '+e.message;
  }
}

$('enable').onclick=registerPhone;
$('test').onclick=testPush;
$('newcode').onclick=async()=>{
  if(!confirm('기존 PC 연결 코드는 더 이상 사용할 수 없게 됩니다. 새 코드를 만들까요?')) return;
  code=makeCode();localStorage.setItem('pairCode',code);$('code').textContent=code;
  $('st').textContent='새 코드가 생성됐어요. 다시 아이폰 알림 등록을 눌러주세요.';
};
</script>
</body>
</html>
