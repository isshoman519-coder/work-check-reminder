<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#1d4ed8">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="근무확인">
<link rel="manifest" href="./manifest.json">
<link rel="apple-touch-icon" href="./apple-touch-icon.png">
<title>근무확인 알리미</title>
<style>
:root{
  font-family:-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo","Noto Sans KR",sans-serif;
  color-scheme:dark;
  --bg:#0b1220;--card:#1e293b;--card2:#0f172a;--line:#334155;
  --fg:#f8fafc;--mut:#94a3b8;--blue:#2563eb;--green:#86efac;--red:#fda4af;
}
*{box-sizing:border-box}
body{
  margin:0;min-height:100svh;color:var(--fg);
  background:radial-gradient(circle at 50% -20%,rgba(37,99,235,.28),transparent 42%),var(--bg);
  padding:max(28px,env(safe-area-inset-top)) 20px max(28px,env(safe-area-inset-bottom));
}
.wrap{width:min(100%,440px);margin:0 auto;min-height:calc(100svh - 56px);display:flex;align-items:center}
.card{width:100%;background:rgba(30,41,59,.97);border:1px solid var(--line);border-radius:26px;padding:24px;box-shadow:0 20px 60px rgba(0,0,0,.25)}
h1{font-size:27px;margin:0 0 8px;letter-spacing:-.04em}
.desc{color:var(--mut);line-height:1.55;font-size:15px}
.section{margin-top:20px;background:var(--card2);border-radius:20px;padding:18px;border:1px solid rgba(255,255,255,.05)}
.label{font-size:13px;color:var(--mut);margin-bottom:7px}
.code{font-size:27px;letter-spacing:.1em;font-weight:900;text-align:center;padding:13px 5px;user-select:all}
.next{text-align:center}.nextTime{font-size:46px;font-weight:900;letter-spacing:-.04em;margin-top:2px}
.countdown{margin-top:4px;font-size:23px;font-weight:800;color:#bfdbfe;font-variant-numeric:tabular-nums}
.badge{display:inline-flex;margin-top:10px;padding:6px 10px;border-radius:999px;font-size:12px;font-weight:800}
.badge.active{background:rgba(74,222,128,.12);color:#86efac}.badge.idle{background:rgba(148,163,184,.12);color:#cbd5e1}
button{width:100%;border:0;border-radius:15px;padding:16px;margin-top:10px;font-size:17px;font-weight:850;color:#fff;background:var(--blue)}
button.secondary{background:#334155}button.ghost{background:transparent;color:#cbd5e1;border:1px solid #475569}
#st{margin-top:14px;min-height:38px;color:#cbd5e1;font-size:13px;line-height:1.5;word-break:break-word}
.ok{color:var(--green)}.warn{color:var(--red)}
.sync{font-size:11px;color:#64748b;text-align:center;margin-top:8px}
.platform{margin-top:10px;font-size:12px;color:#94a3b8;text-align:center}
</style>
</head>
<body>
<div class="wrap"><div class="card">
  <h1>⏱ 근무확인 알리미</h1>
  <div class="desc">PC에서 근무확인 버튼을 누르면 자동으로 50분 뒤 휴대폰 알림을 예약합니다.</div>

  <div class="section">
    <div class="label">PC 확장프로그램 페어링 코드</div>
    <div id="code" class="code">------------</div>
    <div id="platform" class="platform"></div>
  </div>

  <div class="section next">
    <div class="label">다음 근무확인 알림</div>
    <div id="nextTime" class="nextTime">--:--</div>
    <div id="countdown" class="countdown">예약 없음</div>
    <div id="badge" class="badge idle">대기 중</div>
    <div id="sync" class="sync"></div>
  </div>

  <button id="enable">🔔 이 휴대폰 알림 등록</button>
  <button id="refresh" class="secondary">예약 상태 새로고침</button>
  <button id="cancel" class="secondary">퇴근 · 알림 예약 중지</button>
  <button id="test" class="secondary">테스트 알림 보내기</button>
  <button id="newcode" class="ghost">새 페어링 코드 만들기</button>

  <div class="platform">v8 · iPhone + Android 통합</div>
  <div id="st">서버 상태 확인 중...</div>
</div></div>

<script>
const WORKER_URL='https://overtime-alarm.wogns2925.workers.dev';
const $=id=>document.getElementById(id);
const isIOS=/iPhone|iPad|iPod/.test(navigator.userAgent);
const isAndroid=/Android/.test(navigator.userAgent);
const standalone=navigator.standalone||matchMedia('(display-mode: standalone)').matches;
$('platform').textContent=isAndroid?'Android · 알림 진동 사용':isIOS?'iPhone · iOS 기본 알림 햅틱 사용':'웹 브라우저';
function makeCode(){const alphabet='ABCDEFGHJKLMNPQRSTUVWXYZ23456789';const a=new Uint8Array(12);crypto.getRandomValues(a);return Array.from(a,b=>alphabet[b%alphabet.length]).join('');}
let code=localStorage.getItem('pairCode')||makeCode();
localStorage.setItem('pairCode',code);$('code').textContent=code;
let current=null,serverOffset=0,lastStatusAt=0,statusPending=false,mutationPending=false,epoch=0,syncFailed=true,swPromise;
const b64=s=>Uint8Array.from(atob((s+'='.repeat((4-s.length%4)%4)).replace(/-/g,'+').replace(/_/g,'/')),c=>c.charCodeAt(0));
function prepareSW(){
  if(!('serviceWorker' in navigator)) return Promise.reject(new Error('이 브라우저는 알림 등록을 지원하지 않습니다.'));
  if(!swPromise) swPromise=navigator.serviceWorker.register('./sw.js?v=8',{scope:'./',updateViaCache:'none'}).then(()=>navigator.serviceWorker.ready).catch(e=>{swPromise=null;throw e;});
  return swPromise;
}
if('serviceWorker' in navigator) prepareSW().catch(()=>{});
async function post(path,body={},requestCode=code){
  const controller=new AbortController();const timeout=setTimeout(()=>controller.abort(),15000);
  try{
    const r=await fetch(WORKER_URL+path,{signal:controller.signal,method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({code:requestCode,...body}),cache:'no-store'});
    const j=await r.json().catch(()=>({}));
    if(!r.ok||j.ok===false) throw new Error(j.error||('HTTP '+r.status));
    if(j.apiVersion!==3) throw new Error('Cloudflare 서버 v3 업데이트가 아직 반영되지 않았습니다.');
    return j;
  }catch(e){if(e.name==='AbortError') throw new Error('서버 응답 시간이 초과됐습니다. 다시 확인해 주세요.');throw e;}
  finally{clearTimeout(timeout);}
}
async function clearNotices(){try{const reg=await prepareSW();const all=await reg.getNotifications();all.forEach(n=>n.close());}catch{}}
function applyStatus(j){
  if(typeof j.active!=='boolean'||(j.active&&!Number.isFinite(j.first))) throw new Error('서버 상태 응답 형식을 확인해 주세요.');
  if(current&&j.revision<current.revision) return;
  const changed=current?.timerId!==j.timerId;
  current=j;syncFailed=false;serverOffset=(j.now||Date.now())-Date.now();lastStatusAt=Date.now();
  renderTimer();
  $('sync').textContent='마지막 확인 '+new Intl.DateTimeFormat('ko-KR',{hour:'2-digit',minute:'2-digit',second:'2-digit'}).format(new Date());
  if(changed||j.mode==='stopped') clearNotices();
  $('st').textContent=j.lastPushError?j.lastPushError:!j.phoneRegistered?'휴대폰 알림 등록이 필요합니다.':j.mode==='stopped'?'퇴근 · 알림 예약 중지 완료':j.active?'서버 연결 정상 · 예약 진행 중':'서버 연결 정상 · 예약 없음';
}
async function refreshStatus(){
  if(statusPending||mutationPending) return;
  const requestEpoch=epoch,requestCode=code;statusPending=true;
  try{const j=await post('/status',{},requestCode);if(requestEpoch===epoch&&requestCode===code) applyStatus(j);}
  catch(e){if(requestEpoch===epoch){syncFailed=true;renderTimer();$('sync').textContent='상태 갱신 실패';$('st').textContent='상태 조회 실패: '+e.message;}}
  finally{statusPending=false;}
}
function renderTimer(){
  if(syncFailed){$('countdown').textContent='서버 상태 확인 필요';$('badge').textContent='연결 확인 필요';$('badge').className='badge idle';$('nextTime').textContent='--:--';return;}
  if(!current?.active){$('nextTime').textContent='--:--';$('countdown').textContent=current?.mode==='stopped'?'알림 중지됨':'예약 없음';$('badge').textContent=current?.mode==='stopped'?'퇴근 · 중지':'대기 중';$('badge').className='badge idle';return;}
  const t=new Date(current.first);$('nextTime').textContent=String(t.getHours()).padStart(2,'0')+':'+String(t.getMinutes()).padStart(2,'0');
  const left=current.first-(Date.now()+serverOffset);
  if(left<=0) $('countdown').textContent='알림 발송 확인 중';
  else{const sec=Math.ceil(left/1000),h=Math.floor(sec/3600),m=Math.floor(sec%3600/60),s=sec%60;$('countdown').textContent=(h?String(h).padStart(2,'0')+':':'')+String(m).padStart(2,'0')+':'+String(s).padStart(2,'0')+' 남음';}
  $('badge').textContent='예약 진행 중';$('badge').className='badge active';
}
async function mutate(action){
  if(mutationPending) return;
  mutationPending=true;epoch++;
  try{await action();}catch(e){$('st').textContent='요청 실패: '+e.message;}
  finally{mutationPending=false;refreshStatus();}
}
async function registerPhone(){
  if(isIOS&&!standalone) throw new Error('Safari에서 홈 화면에 추가한 앱으로 실행해 주세요.');
  if(!('Notification' in window)) throw new Error('알림을 지원하는 휴대폰 브라우저로 실행해 주세요.');
  let p=Notification.permission;if(p==='default') p=await Notification.requestPermission();
  if(p!=='granted') throw new Error('알림 권한을 허용해 주세요.');
  $('st').textContent='알림 등록 중...';const reg=await prepareSW();
  const r=await fetch(WORKER_URL+'/vapid',{cache:'no-store'});if(!r.ok) throw new Error('알림 서버 설정 확인 필요');
  const pub=(await r.text()).trim();
  let sub=await reg.pushManager.getSubscription();
  if(!sub) sub=await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64(pub)});
  applyStatus(await post('/register',{sub:sub.toJSON()}));
}
$('enable').onclick=()=>mutate(registerPhone);
$('refresh').onclick=refreshStatus;
$('cancel').onclick=()=>mutate(async()=>{applyStatus(await post('/cancel'));clearNotices();});
$('test').onclick=()=>mutate(async()=>{const j=await post('/test');$('st').textContent='테스트 알림 전송 요청 완료 ('+j.status+')';});
$('newcode').onclick=()=>{
  if(!confirm('기존 코드의 예약과 등록을 해제합니다. 새 코드는 PC에도 입력해야 합니다. 계속할까요?')) return;
  mutate(async()=>{
    await post('/unregister');await clearNotices();code=makeCode();localStorage.setItem('pairCode',code);$('code').textContent=code;current=null;syncFailed=true;epoch++;renderTimer();
    $('st').textContent='새 코드가 만들어졌습니다. 휴대폰 알림 등록 후 PC에도 같은 코드를 입력하세요.';
  });
};
setInterval(renderTimer,1000);
setInterval(()=>{if(!document.hidden) refreshStatus();},10000);
document.addEventListener('visibilitychange',()=>{if(!document.hidden) refreshStatus();});
window.addEventListener('focus',()=>{if(Date.now()-lastStatusAt>3000) refreshStatus();});
if('serviceWorker' in navigator) navigator.serviceWorker.addEventListener('message',e=>{if(e.data?.type==='REFRESH_STATUS') refreshStatus();});
refreshStatus();
</script>
</body></html>
